<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Countdown Timer</title>
<style>
:root { color-scheme: dark; }
body {
  font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  color: #e9eef5; background: #1b1f26; margin: 0; padding: 14px;
}
label { display: block; margin: 10px 0 4px; color: #b6c0cf; font-weight: 600; }
label.check { display: flex; gap: 8px; align-items: center; font-weight: 400; color: #e9eef5; margin: 6px 0; }
input[type=text], input[type=number], select {
  width: 100%; box-sizing: border-box; padding: 6px 8px; border-radius: 6px;
  border: 1px solid #38414f; background: #10141a; color: #e9eef5; font: inherit;
}
.row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.row span { display: block; color: #8a94a6; font-size: 11px; margin-top: 2px; text-align: center; }
.presets { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
button {
  padding: 5px 10px; border-radius: 6px; border: 1px solid #38414f;
  background: #262c35; color: #e9eef5; font: inherit; cursor: pointer;
}
button:hover { background: #313946; }
.hint { color: #8a94a6; margin: 12px 0 0; }
hr { border: 0; border-top: 1px solid #2c333e; margin: 14px 0 4px; }
</style>
</head>
<body>
  <label>Duration</label>
  <div class="row">
    <div><input id="hours" type="number" min="0" max="99" /><span>hours</span></div>
    <div><input id="minutes" type="number" min="0" max="59" /><span>min</span></div>
    <div><input id="seconds" type="number" min="0" max="59" /><span>sec</span></div>
  </div>
  <div class="presets" id="presets">
    <button data-s="60">1m</button>
    <button data-s="300">5m</button>
    <button data-s="600">10m</button>
    <button data-s="900">15m</button>
    <button data-s="1500">25m</button>
    <button data-s="3600">1h</button>
  </div>

  <label for="label">Label <span style="font-weight:400;color:#8a94a6">(optional, above time)</span></label>
  <input id="label" type="text" maxlength="12" placeholder="Tea" />

  <hr />
  <label class="check"><input id="flash" type="checkbox" /> Flash key when done</label>
  <label class="check"><input id="sound" type="checkbox" /> Play sound when done</label>
  <label class="check"><input id="repeatSound" type="checkbox" /> Repeat sound until dismissed</label>
  <label class="check"><input id="overtime" type="checkbox" /> Keep counting up after zero (+0:12)</label>

  <label for="soundFile">Sound file</label>
  <input id="soundFile" type="text" placeholder="/usr/share/sounds/freedesktop/stereo/alarm-clock-elapsed.oga" />
  <div class="presets"><button id="test">Test sound</button></div>

  <label for="dialStep">Dial step</label>
  <select id="dialStep">
    <option value="1">1 second</option>
    <option value="5">5 seconds</option>
    <option value="15">15 seconds</option>
    <option value="30">30 seconds</option>
    <option value="60">1 minute</option>
    <option value="300">5 minutes</option>
  </select>

  <p class="hint">
    Tap: start / pause. Hold: reset. Tap while ringing: dismiss.<br />
    Duration changes made mid-run apply on next reset.
  </p>

<script>
// Connects under both conventions OpenDeck ships: the Elgato global function and
// OpenDeck's openDeckConnection promise. Settings go out on the ACTION context
// (actionInfo.context), not the inspector uuid.
(function () {
  let socket = null, context = null, settings = {};
  const $ = (id) => document.getElementById(id);
  const DEFAULTS = {
    hours: 0, minutes: 5, seconds: 0, label: "", flash: true, sound: true,
    repeatSound: false, overtime: false, soundFile: "", dialStep: 60,
  };

  function fill() {
    const s = Object.assign({}, DEFAULTS, settings);
    ["hours", "minutes", "seconds", "label", "soundFile"].forEach((k) => { $(k).value = s[k]; });
    ["flash", "sound", "repeatSound", "overtime"].forEach((k) => { $(k).checked = !!s[k]; });
    $("dialStep").value = String(s.dialStep);
  }

  function save(patch) {
    settings = Object.assign({}, DEFAULTS, settings, patch);
    if (socket && socket.readyState === 1) {
      socket.send(JSON.stringify({ event: "setSettings", context, payload: settings }));
    }
  }

  function toPlugin(payload) {
    if (socket && socket.readyState === 1) {
      socket.send(JSON.stringify({ event: "sendToPlugin", context, payload }));
    }
  }

  const clamp = (v, max) => Math.max(0, Math.min(max, Math.floor(Number(v) || 0)));

  ["hours", "minutes", "seconds"].forEach((k) => {
    $(k).addEventListener("change", () => {
      const max = k === "hours" ? 99 : 59;
      $(k).value = clamp($(k).value, max);
      save({ [k]: Number($(k).value) });
    });
  });
  $("label").addEventListener("change", () => save({ label: $("label").value }));
  $("soundFile").addEventListener("change", () => save({ soundFile: $("soundFile").value.trim() }));
  $("dialStep").addEventListener("change", () => save({ dialStep: Number($("dialStep").value) }));
  ["flash", "sound", "repeatSound", "overtime"].forEach((k) => {
    $(k).addEventListener("change", () => save({ [k]: $(k).checked }));
  });
  $("presets").addEventListener("click", (e) => {
    const s = Number(e.target.dataset && e.target.dataset.s);
    if (!s) return;
    save({ hours: Math.floor(s / 3600), minutes: Math.floor((s % 3600) / 60), seconds: s % 60 });
    fill();
  });
  $("test").addEventListener("click", () => toPlugin({ command: "testSound" }));

  function start(port, uuid, registerEvent, _info, actionInfo) {
    const info = typeof actionInfo === "string" ? JSON.parse(actionInfo) : actionInfo;
    context = info.context;
    settings = (info.payload && info.payload.settings) || {};
    fill();
    socket = new WebSocket("ws://127.0.0.1:" + port);
    socket.onopen = () => socket.send(JSON.stringify({ event: registerEvent, uuid }));
    socket.onmessage = (event) => {
      let msg;
      try { msg = JSON.parse(event.data); } catch (e) { return; }
      if (msg.event === "didReceiveSettings") {
        settings = (msg.payload && msg.payload.settings) || {};
        fill();
      }
    };
  }

  fill();
  window.connectElgatoStreamDeckSocket = start;
  window.connectSocket = start;
  if (window.openDeckConnection && window.openDeckConnection.then) {
    window.openDeckConnection.then((a) => start.apply(null, a));
  }
})();
</script>
</body>
</html>
