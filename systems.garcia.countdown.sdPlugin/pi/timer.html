<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Countdown Timer</title>
<link rel="stylesheet" href="_shared.css" />
<script src="_shared.js"></script>
</head>
<body>
  <label>Duration</label>
  <div class="row">
    <div><input id="hours" type="number" min="0" max="99" /><span>hours</span></div>
    <div><input id="minutes" type="number" min="0" max="59" /><span>min</span></div>
    <div><input id="seconds" type="number" min="0" max="59" /><span>sec</span></div>
  </div>
  <div class="presets" id="presets">
    <button data-s="60">1m</button>
    <button data-s="300">5m</button>
    <button data-s="600">10m</button>
    <button data-s="900">15m</button>
    <button data-s="1500">25m</button>
    <button data-s="3600">1h</button>
  </div>

  <label for="label">Label <span class="muted">(optional, above the time)</span></label>
  <input id="label" type="text" maxlength="12" placeholder="Tea" />

  <hr />
  <label class="check"><input id="flash" type="checkbox" /> Flash key when done</label>
  <label class="check"><input id="sound" type="checkbox" /> Play sound when done</label>
  <label class="check"><input id="repeatSound" type="checkbox" /> Repeat sound until dismissed</label>
  <label class="check"><input id="overtime" type="checkbox" /> Keep counting up after zero (+0:12)</label>

  <label class="check"><input id="notify" type="checkbox" /> Desktop notification</label>

  <label for="snooze">Snooze <span class="muted">(hold the key while it rings)</span></label>
  <select id="snooze">
    <option value="0">Off (hold dismisses)</option>
    <option value="60">1 minute</option>
    <option value="300">5 minutes</option>
    <option value="600">10 minutes</option>
    <option value="900">15 minutes</option>
  </select>

  <label for="soundFile">Sound file</label>
  <input id="soundFile" type="text" placeholder="/usr/share/sounds/freedesktop/stereo/alarm-clock-elapsed.oga" />
  <div class="presets"><button id="test">Test sound</button><button id="testNotify">Test notification</button></div>

  <label for="dialStep">Dial step</label>
  <select id="dialStep">
    <option value="1">1 second</option>
    <option value="5">5 seconds</option>
    <option value="15">15 seconds</option>
    <option value="30">30 seconds</option>
    <option value="60">1 minute</option>
    <option value="300">5 minutes</option>
  </select>

  <p class="hint">
    Tap: start / pause. Hold: reset. Tap while ringing: dismiss. Hold while ringing: snooze.<br />
    Duration changes made mid-run apply on the next reset.
  </p>
<script>
const $ = (id) => document.getElementById(id);
const clamp = (v, max) => Math.max(0, Math.min(max, Math.floor(Number(v) || 0)));
function fill(s) {
  ["hours", "minutes", "seconds"].forEach((k) => { $(k).value = s[k]; });
  $("dialStep").value = String(s.dialStep);
  PI.fillAlarm(s);
}
PI.init({ hours: 0, minutes: 5, seconds: 0, label: "", flash: true, sound: true,
  repeatSound: false, notify: true, snooze: 300, overtime: false, soundFile: "", dialStep: 60 }, fill);
PI.bindAlarm();
["hours", "minutes", "seconds"].forEach((k) => {
  $(k).addEventListener("change", () => {
    $(k).value = clamp($(k).value, k === "hours" ? 99 : 59);
    PI.save({ [k]: Number($(k).value) });
  });
});
$("dialStep").addEventListener("change", () => PI.save({ dialStep: Number($("dialStep").value) }));
$("presets").addEventListener("click", (e) => {
  const s = Number(e.target.dataset && e.target.dataset.s);
  if (!s) return;
  PI.save({ hours: Math.floor(s / 3600), minutes: Math.floor((s % 3600) / 60), seconds: s % 60 });
  fill(PI.settings);
});
</script>
</body>
</html>
