<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Countdown to Date</title>
<link rel="stylesheet" href="_shared.css" />
<script src="_shared.js"></script>
</head>
<body>
  <label data-i18n="pi.deadline.mode">Count down to</label>
  <div class="segmented" id="mode">
    <button data-mode="date" data-i18n="pi.deadline.mode.date">A date &amp; time</button>
    <button data-mode="daily" data-i18n="pi.deadline.mode.daily">A time every day</button>
  </div>

  <div id="dateBox">
    <label for="target" data-i18n="pi.deadline.target">Date and time</label>
    <input id="target" type="datetime-local" step="1" />
    <div class="presets" id="quick">
      <button data-min="60" data-i18n="pi.deadline.quick.hour">In 1 hour</button>
      <button data-tomorrow="9" data-i18n="pi.deadline.quick.tomorrow">Tomorrow 09:00</button>
      <button data-newyear="1" data-i18n="pi.deadline.quick.new_year">New Year</button>
    </div>
  </div>
  <div id="dailyBox" hidden>
    <label for="time" data-i18n="pi.deadline.time">Time of day</label>
    <input id="time" type="time" step="1" />
  </div>

  <label for="label"><span data-i18n="pi.label">Label</span> <span class="muted" data-i18n="pi.label.note">(optional, above the time)</span></label>
  <input id="label" type="text" maxlength="12" placeholder="Launch" data-i18n-placeholder="pi.deadline.label_example" />

  <hr />
  <label class="check"><input id="flash" type="checkbox" /> <span data-i18n="pi.flash">Flash key when done</span></label>
  <label class="check"><input id="sound" type="checkbox" /> <span data-i18n="pi.sound">Play sound when done</span></label>
  <label class="check"><input id="repeatSound" type="checkbox" /> <span data-i18n="pi.repeat_sound">Repeat sound until dismissed</span></label>
  <label class="check"><input id="overtime" type="checkbox" /> <span data-i18n="pi.deadline.overtime">Count up after the date passes (+3:12)</span></label>

  <label class="check"><input id="notify" type="checkbox" /> <span data-i18n="pi.notify">Desktop notification</span></label>

  <label for="snooze"><span data-i18n="pi.snooze">Snooze</span> <span class="muted" data-i18n="pi.snooze.note">(hold the key while it rings)</span></label>
  <select id="snooze">
    <option value="0" data-i18n="pi.snooze.off">Off (hold dismisses)</option>
    <option value="60" data-i18n="pi.duration.1m">1 minute</option>
    <option value="300" data-i18n="pi.duration.5m">5 minutes</option>
    <option value="600" data-i18n="pi.duration.10m">10 minutes</option>
    <option value="900" data-i18n="pi.duration.15m">15 minutes</option>
  </select>

  <label for="soundFile" data-i18n="pi.sound_file">Sound file</label>
  <input id="soundFile" type="text" placeholder="/usr/share/sounds/freedesktop/stereo/alarm-clock-elapsed.oga" />
  <div class="presets"><button id="test" data-i18n="pi.test_sound">Test sound</button><button id="testNotify" data-i18n="pi.test_notify">Test notification</button></div>

  <p class="hint">
    <span data-i18n="pi.deadline.hint.days">More than a day away shows days, with hours:minutes underneath.</span><br />
    <span data-i18n="pi.deadline.hint.controls">Tap: show the target date. Tap while ringing: dismiss. Hold while ringing: snooze.</span><br />
    <span data-i18n="pi.deadline.hint.daily">Daily mode rings every day and then counts down to tomorrow.</span>
  </p>
<script>
const $ = (id) => document.getElementById(id);
const pad = (n) => String(n).padStart(2, "0");
const local = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;

function fill(s) {
  document.querySelectorAll("#mode button").forEach((b) => b.classList.toggle("on", b.dataset.mode === s.mode));
  $("dateBox").hidden = s.mode !== "date";
  $("dailyBox").hidden = s.mode !== "daily";
  $("overtime").closest("label").hidden = s.mode !== "date";
  $("target").value = s.target;
  $("time").value = s.time;
  PI.fillAlarm(s);
}
PI.init({ mode: "date", target: "", time: "", label: "", flash: true, sound: true,
  repeatSound: false, notify: true, snooze: 300, overtime: true, soundFile: "" }, fill);
PI.bindAlarm();

// setAt marks when the target was chosen, so the ring can show progress since then.
function setTarget(patch) { PI.save(Object.assign({ setAt: Date.now() }, patch)); fill(PI.settings); }

$("mode").addEventListener("click", (e) => {
  const mode = e.target.dataset && e.target.dataset.mode;
  if (mode) setTarget({ mode });
});
$("target").addEventListener("change", () => {
  let v = $("target").value;
  if (/T\d\d:\d\d$/.test(v)) v += ":00";
  setTarget({ target: v });
});
$("time").addEventListener("change", () => setTarget({ time: $("time").value }));
$("quick").addEventListener("click", (e) => {
  const b = e.target.dataset || {};
  const d = new Date();
  if (b.min) d.setMinutes(d.getMinutes() + Number(b.min), 0, 0);
  else if (b.tomorrow) { d.setDate(d.getDate() + 1); d.setHours(Number(b.tomorrow), 0, 0, 0); }
  else if (b.newyear) { d.setFullYear(d.getFullYear() + 1, 0, 1); d.setHours(0, 0, 0, 0); }
  else return;
  setTarget({ mode: "date", target: local(d) });
});
</script>
</body>
</html>
