<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pomodoro</title>
<link rel="stylesheet" href="_shared.css" />
<script src="_shared.js"></script>
</head>
<body>
  <label><span data-i18n="pi.pomodoro.lengths">Lengths</span> <span class="muted" data-i18n="pi.pomodoro.lengths.note">(minutes)</span></label>
  <div class="row">
    <div><input id="work" type="number" min="1" max="180" /><span data-i18n="pi.pomodoro.focus">focus</span></div>
    <div><input id="shortBreak" type="number" min="1" max="60" /><span data-i18n="pi.pomodoro.break">break</span></div>
    <div><input id="longBreak" type="number" min="1" max="60" /><span data-i18n="pi.pomodoro.long_break">long break</span></div>
  </div>
  <div class="presets" id="presets">
    <button data-p="25,5,15">25 / 5 / 15</button>
    <button data-p="50,10,30">50 / 10 / 30</button>
    <button data-p="90,20,30">90 / 20 / 30</button>
  </div>

  <label for="rounds" data-i18n="pi.pomodoro.rounds">Long break after</label>
  <select id="rounds">
    <option value="2" data-i18n="pi.pomodoro.rounds_option" data-count="2">2 focus rounds</option>
    <option value="3" data-i18n="pi.pomodoro.rounds_option" data-count="3">3 focus rounds</option>
    <option value="4" data-i18n="pi.pomodoro.rounds_option" data-count="4">4 focus rounds</option>
    <option value="5" data-i18n="pi.pomodoro.rounds_option" data-count="5">5 focus rounds</option>
    <option value="6" data-i18n="pi.pomodoro.rounds_option" data-count="6">6 focus rounds</option>
  </select>
  <label class="check"><input id="autoStart" type="checkbox" /> <span data-i18n="pi.pomodoro.auto_start">Start the next phase automatically</span></label>

  <hr />
  <label class="check"><input id="flash" type="checkbox" /> <span data-i18n="pi.flash">Flash key when done</span></label>
  <label class="check"><input id="sound" type="checkbox" /> <span data-i18n="pi.sound">Play sound when done</span></label>
  <label class="check"><input id="repeatSound" type="checkbox" /> <span data-i18n="pi.repeat_sound">Repeat sound until dismissed</span></label>

  <label class="check"><input id="notify" type="checkbox" /> <span data-i18n="pi.notify">Desktop notification</span></label>

  <label for="snooze"><span data-i18n="pi.snooze">Snooze</span> <span class="muted" data-i18n="pi.snooze.note">(hold the key while it rings)</span></label>
  <select id="snooze">
    <option value="0" data-i18n="pi.snooze.off">Off (hold dismisses)</option>
    <option value="60" data-i18n="pi.duration.1m">1 minute</option>
    <option value="300" data-i18n="pi.duration.5m">5 minutes</option>
    <option value="600" data-i18n="pi.duration.10m">10 minutes</option>
    <option value="900" data-i18n="pi.duration.15m">15 minutes</option>
  </select>

  <label for="soundFile" data-i18n="pi.sound_file">Sound file</label>
  <input id="soundFile" type="text" placeholder="/usr/share/sounds/freedesktop/stereo/alarm-clock-elapsed.oga" />
  <div class="presets"><button id="test" data-i18n="pi.test_sound">Test sound</button><button id="testNotify" data-i18n="pi.test_notify">Test notification</button></div>

  <p class="hint">
    <span data-i18n="pi.pomodoro.hint.controls">Tap: start / pause. Hold: restart the cycle. Touch the strip: skip to the next phase.</span><br />
    <span data-i18n="pi.pomodoro.hint.phase_end">When a phase ends: tap to start the next one, hold to snooze.</span><br />
    <span data-i18n="pi.pomodoro.hint.auto">With auto-start on, phases flow into each other and just chime.</span>
  </p>
<script>
const $ = (id) => document.getElementById(id);
const MIN = { work: [1, 180], shortBreak: [1, 60], longBreak: [1, 60] };
function fill(s) {
  Object.keys(MIN).forEach((k) => { $(k).value = Math.round(s[k] / 60); });
  $("rounds").value = String(s.rounds);
  $("autoStart").checked = !!s.autoStart;
  PI.fillAlarm(s);
}
PI.init({ work: 1500, shortBreak: 300, longBreak: 900, rounds: 4, autoStart: false,
  flash: true, sound: true, repeatSound: false, notify: true, snooze: 300, soundFile: "" }, fill);
PI.bindAlarm();
Object.keys(MIN).forEach((k) => {
  $(k).addEventListener("change", () => {
    const [lo, hi] = MIN[k];
    const m = Math.max(lo, Math.min(hi, Math.round(Number($(k).value) || lo)));
    $(k).value = m;
    PI.save({ [k]: m * 60 });
  });
});
$("rounds").addEventListener("change", () => PI.save({ rounds: Number($("rounds").value) }));
$("autoStart").addEventListener("change", () => PI.save({ autoStart: $("autoStart").checked }));
$("presets").addEventListener("click", (e) => {
  const p = e.target.dataset && e.target.dataset.p;
  if (!p) return;
  const [w, s, l] = p.split(",").map(Number);
  PI.save({ work: w * 60, shortBreak: s * 60, longBreak: l * 60 });
  fill(PI.settings);
});
</script>
</body>
</html>
